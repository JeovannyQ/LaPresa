# MediaMTX — servidor de ingesta RTMP de La Presa
# El celular (Larix Broadcaster) publica aquí; server.ts consume la señal con
# ffmpeg y produce el HLS que ve el público. MediaMTX no sirve nada al público.
#
# Arranque:  ./mediamtx mediamtx.yml
# Descarga:  https://github.com/bluenviron/mediamtx/releases
#
# OJO: este archivo usa el formato de configuración de MediaMTX v1.x
# (authInternalUsers). Las versiones 0.x usaban publishUser/publishPass dentro
# de cada path; si bajas una versión vieja, esto no le va a servir.

logLevel: info
logDestinations: [stdout]

# ─── RTMP: la única puerta de entrada ────────────────────────────────────────
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# Protocolos de salida apagados: el HLS lo genera ffmpeg desde server.ts, y
# dejar estos puertos abiertos sería exponer la señal sin control ni estadística.
hls: no
webrtc: no
srt: no
rtsp: no
# MoQ (Media over QUIC) viene encendido por defecto desde las versiones nuevas y
# abre :8892 TCP/UDP y :8893 UDP. Ademas se genera un certificado auto.key en el
# directorio de trabajo, escritura que el servicio de systemd bloquea a proposito
# (ProtectSystem=strict). Apagado: aqui solo entra RTMP.
moq: no

# ─── Autenticación ───────────────────────────────────────────────────────────
# Sin esto, cualquiera que adivine la URL puede publicar en el canal y sacar al
# aire lo que quiera.
#
# Las dos claves NO se escriben aquí: llegan por entorno desde Dokploy, con
#   MTX_AUTHINTERNALUSERS_0_PASS  y  MTX_AUTHINTERNALUSERS_1_PASS
# (ver docker-compose.yml). Los valores de abajo son centinelas a propósito: si
# el entorno no llega, la autenticación falla y nadie publica, en vez de quedar
# el canal abierto con una clave conocida.
authInternalUsers:
  # El celular en la gallera. Es el único que puede publicar.
  - user: gallera
    pass: SIN-CONFIGURAR-RTMP-PUBLISH-PASS
    ips: []
    permissions:
      - action: publish
        path: live/gallera

  # ffmpeg leyendo la señal desde el contenedor de la app. Antes esto era
  # ['127.0.0.1'] porque ambos procesos vivían en la misma máquina; en Docker cada
  # contenedor tiene su IP en la red bridge y el loopback dejaría fuera a ffmpeg.
  #
  # Se restringe a la subred interna del compose, que no es enrutable desde fuera.
  # Esto NO es decorativo: el 1935 está publicado a internet, así que sin este
  # cerrojo una filtración de la clave interna permitiría leer la señal desde
  # cualquier parte. La subred está fijada en docker-compose.yml justamente para
  # que este rango siga significando algo; si se cambia allí, hay que cambiarla aquí.
  - user: interno
    pass: SIN-CONFIGURAR-RTMP-INTERNAL-PASS
    ips: ['10.89.0.0/24']
    permissions:
      - action: read
        path: live/gallera

# ─── Rutas ───────────────────────────────────────────────────────────────────
paths:
  # Debe coincidir con RTMP_INGEST_URL del .env
  live/gallera:
    source: publisher

    # ─── Grabación de la jornada ─────────────────────────────────────────────
    # Graba MediaMTX, no el ffmpeg de server.ts, y es a propósito: ese ffmpeg
    # solo existe mientras el operador haya pulsado "Iniciar" en el panel, así
    # que la noche que se le olvide no queda grabación de nada. MediaMTX graba
    # todo lo que el celular publique, sin que nadie toque un botón.
    record: yes

    # /recordings es el MISMO volumen que la app monta en /app/recordings (ver
    # docker-compose.yml), así que la web sirve estos archivos sin copiarlos.
    #
    # El %path NO es decorativo: MediaMTX 1.20 se niega a arrancar sin él
    # ("'recordPath' must contain %path") y el contenedor entra en bucle de
    # reinicio, que deja el RTMP sin ingesta. Como esta ruta se llama
    # "live/gallera", con barra, %path crea DOS niveles de carpeta:
    #   /recordings/jornadas/live/gallera/2026-08-23_19-30-00.mp4
    # Por eso el servidor busca los .mp4 en subcarpetas y no solo en jornadas/.
    recordPath: /recordings/jornadas/%path/%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4

    # 24h en vez de la 1h por defecto: una jornada dura 4-5 horas y con el corte
    # por defecto saldría partida en cinco archivos, cuando la web muestra una
    # fila por noche. No deja archivos infinitos porque MediaMTX abre uno nuevo
    # cada vez que el celular reconecta.
    recordSegmentDuration: 24h

    # 15 días, la retención pactada. La purga la hace MediaMTX y NO server.ts:
    # estos archivos los crea el contenedor de mediamtx (como root) y borrarlos
    # desde la app, que corre como "node" en otro contenedor, dependería de unos
    # permisos que no controlamos. Leerlos sí puede, que es lo único que necesita.
    recordDeleteAfter: 360h
