# La Presa — nginx del servidor de origen
#
# Reparte el trabajo en tres:
#   /live/  → segmentos HLS servidos DIRECTO desde disco por nginx. Esto es lo
#             importante: antes los servia Express con "no-store", o sea que
#             cada espectador pegaba contra Node cada 4 segundos. Con 1.500
#             conectados eso no se sostiene.
#   /api/   → proxy a Node (arrancar/parar, clips, grabaciones, chat).
#   /       → el build de Vite (dist/), con fallback de SPA.
#
# El TLS lo agrega certbot --nginx sobre este mismo archivo; por eso aqui solo
# hay puerto 80. No edites a mano lo que certbot inserte.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /opt/lapresa/dist;
    index index.html;

    access_log /var/log/nginx/lapresa.access.log;
    error_log  /var/log/nginx/lapresa.error.log;

    # El sitio es texto + video. El video ya viene comprimido, comprimirlo otra
    # vez solo gasta CPU que hace falta para las 3 codificaciones de ffmpeg.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los trozos de clip suben por POST y express acepta hasta 50 MB.
    client_max_body_size 60m;

    # ── HLS en vivo ─────────────────────────────────────────────────────────
    # HLS_DIR es /var/lib/lapresa/live, asi que "root /var/lib/lapresa" hace que
    # la URL /live/720p/seg_00001.ts caiga sola en el archivo correcto, sin alias.
    #
    # El playlist cambia cada 4 s y los segmentos son inmutables mientras viven,
    # asi que llevan cache distinta. Ese max-age es lo que permite a la CDN
    # colapsar 1.500 peticiones simultaneas en una sola al origen.
    location ~* ^/live/.+\.m3u8$ {
        root /var/lib/lapresa;
        types { application/vnd.apple.mpegurl m3u8; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2" always;
    }

    # 60 s es de sobra: un segmento solo vive 40 s en el playlist (10 x 4 s).
    # Deliberadamente NO es "immutable" de un ano: los nombres seg_00001.ts se
    # reinician en cada emision, y una CDN con TTL largo serviria el video de
    # la jornada anterior.
    location ~* ^/live/.+\.ts$ {
        root /var/lib/lapresa;
        types { video/mp2t ts; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=60" always;
    }

    # ── API ─────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las grabaciones son mp4 de 6-8 horas: sin esto nginx intenta
        # bufferizar el archivo entero antes de mandar el primer byte.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Frontend ────────────────────────────────────────────────────────────
    # Vite les pone hash al nombre, asi que un cambio genera un archivo nuevo:
    # se pueden cachear para siempre sin miedo a servir version vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: es quien apunta a los assets con hash nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
